<!DOCTYPE html>
<html>
    <head>
        <title>click Event Example</title>
    </head>
    <body>
        <h2>click Event Handling</h2>
        <button id="greetBtn">Greet</button>
        <button id="changeTextBtn">change Text</button>
        <p id="output">This is the original text.</p>
        <script>
            document.getElementById("greetBtn").onclick=function(){
                alert("Hello!you cliked the greet button.");
            };
            document.getElementById("changeTextBtn").addEventListener("click",function(){
                document.getElementById("output").textcontent="The text has been changed!";
            });
        </script>
    </body>
</html>
